name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  typecheck-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix profile install nixpkgs#devenv
      - run: devenv allow
      - run: devenv shell -- devenv tasks run typecheck:app typecheck:worker
      - run: devenv shell -- devenv tasks run lint:arch lint:arch:self codegen:check
      - run: devenv shell -- devenv tasks run test:unit test:worker
      - run: devenv shell -- devenv tasks run docs:check docs:build

  typecheck-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          extra_nix_config: sandbox = false
      - run: ulimit -n 8192
      - run: nix profile install nixpkgs#devenv
      - run: devenv allow
      - run: devenv shell -- devenv tasks run typecheck:app typecheck:worker
      - run: devenv shell -- devenv tasks run docs:check docs:build

  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          Write-Host "  -> Checking start.sh for Windows/WSL detection ..."
          Select-String -Path scripts/start.sh -Pattern "wsl2|windows|WSL" | ForEach-Object {
            Write-Host "  OK $($_.LineNumber): $($_.Line.Trim())"
          }
          Write-Host "  OK WSL detection present"
        shell: powershell
