inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/nixos-unstable
  devenv:
    url: github:cachix/devenv?ref=v2.2.1
    inputs:
      nixpkgs:
        follows: nixpkgs
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs

require_version: '>=2.2.1'

# Secret resolution via secretspec.toml (provider: dotenv = .env next to
# secretspec.toml, gitignored; scopes runtime/deploy for least privilege).
secretspec:
  enable: true
  provider: dotenv
  profile: default

# Fail loudly on port conflicts instead of silently remapping (prevents
# devenv's sticky fallback-port behaviour from hiding collisions).
strict_ports: true

# Local: `SECRETSPEC_PROVIDER=keyring secretspec config global init` for
# encrypted keychain storage. CI: inject secrets as GitHub Actions env vars.
