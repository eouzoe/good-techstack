[project]
name = "good-techstack"
revision = "1.0"

# Provider aliases used by profile provider chains (SecretSpec 0.15+).
# dotenv  = plain .env next to secretspec.toml (gitignored) — zero setup for dev
# keyring = OS keychain — recommended for personal/team secrets
# env     = ambient environment variables — useful in CI
[providers]
dotenv = "dotenv"
keyring = "keyring://"
env = "env"

# Default profile — always loaded first.
# Declare what the stack needs; values are stored in the provider (never committed).
[profiles.default]
CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token for wrangler deploy", required = false, providers = [
  "env",
  "dotenv",
  "keyring",
] }
CLOUDFLARE_ACCOUNT_ID = { description = "Cloudflare account ID", required = false, providers = [
  "env",
  "dotenv",
  "keyring",
] }
# Auto-generated on first `secretspec check`/`run` when missing (SecretSpec 0.7+).
BETTER_AUTH_SECRET = { description = "better-auth secret key", type = "password", generate = true }
BETTER_AUTH_URL = { description = "better-auth base URL", default = "http://localhost:3000" }
DATABASE_URL = { description = "D1 database URL (production)", required = false }
SESSION_SECRET = { description = "Session signing key for better-auth", required = false }
PUBLIC_APP_URL = { description = "Public-facing application URL", required = false }

# Scopes (SecretSpec 0.17+) — each process only gets the secrets it needs.
[scopes.runtime]
secrets = ["BETTER_AUTH_SECRET", "BETTER_AUTH_URL", "SESSION_SECRET", "DATABASE_URL"]

[scopes.deploy]
secrets = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"]
