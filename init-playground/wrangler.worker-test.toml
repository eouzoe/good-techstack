# Phase E — Worker-boundary test config.
#
# Deliberately MUCH thinner than the real `alchemy.run.ts` stack: it carries
# only the bindings the phase under test actually exercises (D1 `DB`, the KV
# `KV` namespace, and the `RATELIMIT` rate limiter — the ones the auth boundary
# in `src/server/auth.ts` consumes) plus the main fetch worker. The production
# stack also binds DO/KV/R2/Queues — those pull in service plumbing
# (`EVENTS_DO -> script:gstack`) that workerd must materialise as services, the
# @cloudflare/vitest-plugin runner does not provide out of the box, and Phase E
# does not need. Keeping this minimal is itself a §6.8/ship-what-you-use call
# at the boundary: the D1 path is the one the kernel replicates to the Worker
# runtime.
name = "gstack"
main = "./tests/worker/worker-stub.ts"
compatibility_date = "2026-07-29"

[[d1_databases]]
binding = "DB"
database_name = "gstack-test"
database_id = "test-d1-id"

[[kv_namespaces]]
binding = "KV"
id = "test-kv-id"

[[ratelimits]]
name = "RATELIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[vars]
USE_MOCKS = "false"
BETTER_AUTH_URL = "http://test"
BETTER_AUTH_SECRET = "test-secret"
