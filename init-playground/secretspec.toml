[project]
name = "gstack"
revision = "1.0"

# Provider aliases used by profile provider chains (SecretSpec 0.15+).
# dotenv  = plain .env next to secretspec.toml (gitignored) — zero setup for dev
# keyring = OS keychain — recommended for personal/team secrets
# env     = ambient environment variables — useful in CI
[providers]
dotenv = "dotenv"
keyring = "keyring://"
env = "env"

# Default profile — always loaded first. Declares what the template needs;
# values live in the provider (never committed).
[profiles.default]
CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token for alchemy deploy", required = false, providers = [
  "env",
  "dotenv",
  "keyring",
] }
CLOUDFLARE_ACCOUNT_ID = { description = "Cloudflare account ID", required = false, providers = [
  "env",
  "dotenv",
  "keyring",
] }
# Auto-generated on first `secretspec check`/`run` when missing (SecretSpec 0.7+).
BETTER_AUTH_SECRET = { description = "better-auth secret key", type = "password", generate = true }
BETTER_AUTH_URL = { description = "better-auth base URL", default = "http://localhost:1337" }

# Production overrides the default profile (inherits the rest).
[profiles.production]
BETTER_AUTH_URL = { description = "Production better-auth base URL", required = true }

# Scopes (SecretSpec 0.17+) — each process only gets the secrets it needs.
# `secretspec run --scope <name>` narrows the child environment to this subset.
[scopes.runtime]
secrets = ["BETTER_AUTH_SECRET", "BETTER_AUTH_URL"]

[scopes.deploy]
secrets = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "BETTER_AUTH_SECRET", "BETTER_AUTH_URL"]
