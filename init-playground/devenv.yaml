inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/nixos-unstable
  devenv:
    url: github:cachix/devenv?ref=v2.2.2
    inputs:
      nixpkgs:
        follows: nixpkgs
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs

require_version: '>=2.2.2'

secretspec:
  enable: true
  provider: dotenv
  profile: default

strict_ports: true
